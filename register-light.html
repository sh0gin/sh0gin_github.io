<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
    <link rel="stylesheet" href="access/css/base.css">
    <link rel="stylesheet" href="access/css/light.css">
    <link rel="stylesheet" href="access/css/register-light.css">
</head>

<body>
<header class="height-header">
        <div class="container container-header d-flex">
            <div class="b-img logo"></div>
            <ul class="content-header">
                <li class="h-elem">
                    <a href="index-light.html" class="width-100 link-header">
                        Главная
                    </a>
                </li>
                <li class="h-elem">
                    <a href="login-light.html" class="width-100 link-header">
                        Войти
                    </a>
                </li>
                <li class="h-elem">
                    <a href="register-light.html" class="width-100 link-header active">
                        Регистрация
                    </a>
                </li>
                <li class="h-elem">
                    <a href="admin-light.html" class="width-100 link-header">
                        Личный кабинет
                    </a>
                </li>
            </ul>
            <div class="burger"></div>
        </div>
    </header>
    <main>
        <section class="width-100 d-flex px59 col">
            <h2 class="title-one gradient pb75">Регистрация</h2>
            <div class="container jac d-flex col g25">
                <form action="#" class="d-flex col jac form">
                    <div class="inputs-block">
                        <div class="one-input-block">
                            <label class="d-flex col width-100">
                                E-mail
                                <input type="email" class="input-elem width-100 danger" placeholder="Email">
                                <span class="red">Пустое поле</span>
                            </label>
                            <label class="d-flex col width-100">
                                Пароль
                                <input type="password" class="input-elem width-100 success" placeholder="Пароль" value="12365512Ee">
                                <span class="green">Всё верно</span>
                            </label>
                            <label class="d-flex col width-100">
                                Фамилия
                                <input type="text" class="input-elem width-100" placeholder="Фамилия">
                                <span class="green">⠀</span>
                            </label>
                            <label class="d-flex col width-100">
                                Имя
                                <input type="text" class="input-elem width-100" placeholder="Имя">
                                <span class="green">⠀</span>
                            </label>
                        </div>
                        <div class="one-input-block">
                            <label class="d-flex col width-100">
                                Дата рождения
                                <input type="date" class="input-elem width-100 py15">
                                <span class="green">⠀</span>
                            </label>
                            <label class="d-flex col width-100">
                                Номер телефона
                                <input type="text" class="input-elem width-100" placeholder="Номер телефона">
                                <span class="green">⠀</span>
                            </label>
                            <label class="d-flex col width-100">
                                Повтор пароля
                                <input type="password" class="input-elem width-100" placeholder="Повтор пароля">
                                <span class="green">⠀</span>
                            </label>

                        </div>
                    </div>
                    <div class="fogget-password width-100">
                        <input type="checkbox" id="check">
                        <label for="check" class="black text">Согласен на обработку персональных данных</label>
                        <div class="line mt10"></div>
                    </div>
                    <button type="submit" class="general-button register-type">Зарегистрироваться</button>
                </form>
            </div>
        </section>
    </main>
    <footer>
        <div class='container px50 container-footer'>
            <ul class="elem-footer padding-settign">
                <li>
                    <a href="tel:+78001235667">Телефон: 8-800-123-45-67</a>
                </li>
                <li>
                    <a href="mailto:support@eduspace.ru">E-mail: support@edulang.ru</a>
                </li>
            </ul>
            <ul class="elem-footer padding-settign">
                <li>
                    <a href="#">Для студентов</a>
                </li>
                <li>
                    <a href="#">Для преподавателей</a>
                </li>
                <li>
                    <a href="#">О нас</a>
                </li>
                <li>
                    <a href="#">Контакты</a>
                </li>
            </ul>
            <div class="b-img qr"></div>
            <ul class="elem-footer">
                <li class="two-rem">Навигация по сайту</li>

                <li>
                    <a href="index.html">Главная</a>
                </li>
                <li>
                    <a href="register.html">Регистрация</a>
                </li>
                <li>
                    <a href="login.html">Авторизация</a>
                </li>
                <li>
                    <a href="profile.html">Личный кабинет</a>
                </li>
            </ul>
        </div>
    </footer>
</body>

</html>
